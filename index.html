<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Picker</title>
    <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #24133d;
      --muted: #695a7d;
      --accent: #6d3dd1;
      --accent-dark: #4e25a8;
      --surface: #ffffff;
      --soft: #f3edff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: linear-gradient(135deg, #4b1d83, #9258d8);
    }
          main {
      width: min(100%, 720px);
      padding: clamp(28px, 6vw, 56px);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(31, 11, 61, 0.3);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.75rem);
      line-height: 1.05;
    }

    .intro {
      max-width: 55ch;
      margin: 16px 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
          .mood-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .mood-button {
      min-height: 58px;
      padding: 14px 18px;
      border: 2px solid transparent;
      border-radius: 16px;
      color: var(--ink);
      background: var(--soft);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
  </style>
</head>
<body>
    <main>
    <p class="eyebrow">Quick reset</p>
    <h1>How are you feeling?</h1>
    <p class="intro">Choose a mood and get one small activity you can try right now.</p>

    <div class="mood-grid" aria-label="Mood choices">
      <button class="mood-button" type="button" data-mood="energized" aria-pressed="false">Energized</button>
      <button class="mood-button" type="button" data-mood="calm" aria-pressed="false">Calm</button>
      <button class="mood-button" type="button" data-mood="curious" aria-pressed="false">Curious</button>
      <button class="mood-button" type="button" data-mood="tired" aria-pressed="false">Tired</button>
    </div>

    <section class="result" aria-live="polite">
      <p class="result-label">Your activity</p>
      <p id="recommendation">Pick a mood to see a suggestion.</p>
    </section>
  </main>
</body>
</html>
